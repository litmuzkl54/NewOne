<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Cloud Business Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#0176D3;--primary-dark:#014486;--accent:#FF6B00;--success:#00A86B;--bg:#F4F6F9;--card:#FFF;--text:#032E61;--text-light:#596E84;--border:#E0E5ED}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.container{max-width:1100px;margin:0 auto;padding:40px 20px}.header{text-align:center;margin-bottom:50px}.header h1{font-family:'Manrope',sans-serif;font-size:42px;font-weight:800;margin-bottom:12px}.wizard-container{background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}.progress-bar{height:6px;background:var(--border)}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s;width:0}.wizard-content{padding:50px}.step{display:none}.step.active{display:block;animation:fadeIn .4s}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.step-number{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;width:40px;height:40px;border-radius:50%;text-align:center;line-height:40px;font-weight:700;margin-bottom:20px}.step h2{font-size:28px;font-weight:700;margin-bottom:12px}.step-description{color:var(--text-light);margin-bottom:32px}.use-case-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}.use-case-card{border:2px solid var(--border);border-radius:14px;padding:28px;cursor:pointer;transition:all .3s;position:relative}.use-case-card:hover{border-color:var(--primary);box-shadow:0 6px 20px rgba(1,118,211,0.12);transform:translateY(-2px)}.use-case-card.selected{border-color:var(--primary);background:rgba(1,118,211,0.04)}.use-case-card.selected::after{content:'✓';position:absolute;top:20px;right:20px;width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.use-case-icon{font-size:36px;margin-bottom:16px;display:block}.use-case-title{font-weight:700;font-size:20px;margin-bottom:12px}.use-case-includes{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}.use-case-includes ul{list-style:none;padding:0}.use-case-includes li{font-size:14px;color:var(--text-light);padding:4px 0 4px 20px;position:relative}.use-case-includes li::before{content:'✓';position:absolute;left:0;color:var(--success);font-weight:bold}.checkbox-item{display:flex;align-items:flex-start;padding:16px;border:2px solid var(--border);border-radius:10px;margin-bottom:12px;cursor:pointer;transition:all .3s}.checkbox-item:hover{border-color:var(--primary)}.checkbox-item.selected{border-color:var(--primary);background:rgba(1,118,211,0.04)}.checkbox-box{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;margin-right:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}.checkbox-item.selected .checkbox-box{background:var(--primary);border-color:var(--primary)}.checkbox-item.selected .checkbox-box::after{content:'✓';color:#fff;font-size:14px;font-weight:bold}.checkbox-title{font-weight:600;margin-bottom:4px}.checkbox-desc{font-size:13px;color:var(--text-light)}.input-group{margin-bottom:24px}.input-label{font-weight:600;margin-bottom:10px;display:block}input[type=number]{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-size:16px}input:focus{outline:none;border-color:var(--primary)}.input-hint{font-size:13px;color:var(--text-light);margin-top:6px}.info-box{background:rgba(1,118,211,0.06);border-left:4px solid var(--primary);padding:18px;border-radius:8px;margin:24px 0}.info-box-title{font-weight:700;margin-bottom:8px}.button-group{display:flex;gap:12px;margin-top:40px}.btn{padding:16px 32px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;flex:1}.btn-primary:hover{transform:translateY(-2px)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-secondary{background:var(--border);color:var(--text)}.summary-header{background:linear-gradient(135deg,#0176D3,#014486);padding:40px;border-radius:16px;color:#fff;margin-bottom:32px}.summary-title{font-size:36px;font-weight:800;margin-bottom:24px}.summary-req-item{display:flex;gap:10px;font-size:15px;margin-bottom:8px}.summary-req-item::before{content:'✓';font-weight:bold}.cost-row{display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr;padding:20px 24px;border-bottom:1px solid var(--border);gap:16px}.cost-row.total{background:#F9FAFB;font-weight:700}.cost-value{text-align:right;font-weight:700;color:var(--success);font-size:17px}.cost-row.total .cost-value{color:var(--text);font-size:24px}@media (max-width:968px){.use-case-grid,.cost-row{grid-template-columns:1fr}.cost-value{text-align:left}}@media (max-width:768px){.wizard-content{padding:30px 20px}.button-group{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>💡 Data Cloud Business Calculator</h1>
<p style="color:var(--text-light);font-size:18px">Answer questions about your business needs to calculate your Data Cloud investment</p>
</div>
<div class="wizard-container">
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="wizard-content" id="content"></div>
</div>
</div>
<script>
let step=1,data={useCase:'',channels:[],docs:{},identity:{},sources:[],base:{},campaigns:0};
function render(){const c=document.getElementById('content');c.innerHTML=getHTML();attach()}
function getHTML(){
if(step==1)return`<div class="step active"><span class="step-number">1</span><h2>What's your primary business goal?</h2><p class="step-description">Select the main objective for Data Cloud</p><div class="use-case-grid"><div class="use-case-card" data-use="agentforce"><span class="use-case-icon">🤖</span><div class="use-case-title">AI-Powered Customer Engagement</div><p>Deploy Agentforce chatbots with contextual interactions</p><div class="use-case-includes"><ul><li>Identity resolution (anonymous → known)</li><li>Unstructured data processing (PDFs, FAQs)</li><li>Real-time profile enrichment</li></ul></div></div><div class="use-case-card" data-use="personalization"><span class="use-case-icon">🎯</span><div class="use-case-title">Omnichannel Personalization</div><p>Personalized experiences across email, web, mobile</p><div class="use-case-includes"><ul><li>Cross-device identity resolution</li><li>Unified customer profiles</li><li>Segment activation</li></ul></div></div></div><div class="button-group"><button class="btn btn-primary" onclick="next()" id="next1" disabled>Continue →</button></div></div>`;
if(step==2&&data.useCase!='agentforce'){step=4;return getHTML()}
if(step==2)return`<div class="step active"><span class="step-number">2</span><h2>Content for Agentforce</h2><p class="step-description">How many documents will your chatbot process?</p><div class="input-group"><label class="input-label">Product Catalogs</label><input type="number" id="prod" min="0" placeholder="100"></div><div class="input-group"><label class="input-label">FAQ Articles</label><input type="number" id="faq" min="0" placeholder="200"></div><div class="input-group"><label class="input-label">Technical Docs (PDFs)</label><input type="number" id="tech" min="0" placeholder="150"></div><div class="info-box"><div class="info-box-title">📄 Total: <span id="tot">0</span> documents</div></div><div class="button-group"><button class="btn btn-secondary" onclick="prev()">← Back</button><button class="btn btn-primary" onclick="next()">Continue →</button></div></div>`;
if(step==3)return`<div class="step active"><span class="step-number">3</span><h2>Identity Resolution Needs</h2><p class="step-description">How should we recognize customers?</p><div class="checkbox-item" data-id="visitor"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">Recognize Returning Visitors</div><div class="checkbox-desc">Cookie-based recognition</div></div></div><div class="checkbox-item" data-id="email"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">Link Email to Web</div><div class="checkbox-desc">Track email clicks to website</div></div></div><div class="button-group"><button class="btn btn-secondary" onclick="prev()">← Back</button><button class="btn btn-primary" onclick="next()">Continue →</button></div></div>`;
if(step==4)return`<div class="step active"><span class="step-number">4</span><h2>Data Sources</h2><p class="step-description">Which systems connect to Data Cloud?</p><div class="checkbox-item" data-src="crm" data-gb="30"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">☁️ Salesforce CRM</div><div class="checkbox-desc">~30 GB/month</div></div></div><div class="checkbox-item" data-src="aep" data-gb="50"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">🌐 Adobe Experience Platform</div><div class="checkbox-desc">~50 GB/month</div></div></div><div class="checkbox-item" data-src="ecom" data-gb="35"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">🛒 E-commerce</div><div class="checkbox-desc">~35 GB/month</div></div></div><div class="info-box"><div class="info-box-title">📊 Estimated: <span id="gb">0</span> GB/month</div></div><div class="button-group"><button class="btn btn-secondary" onclick="prev()">← Back</button><button class="btn btn-primary" onclick="next()" id="next4" disabled>Continue →</button></div></div>`;
if(step==5)return`<div class="step active"><span class="step-number">5</span><h2>Customer Base</h2><p class="step-description">Tell us about your customers</p><div class="input-group"><label class="input-label">CRM Contacts</label><input type="number" id="crm" placeholder="1000000" min="0"></div><div class="input-group"><label class="input-label">Website Visitors/Month</label><input type="number" id="web" placeholder="500000" min="0"></div><div class="info-box"><div class="info-box-title">👥 Total Profiles: <span id="prof">0</span></div></div><div class="button-group"><button class="btn btn-secondary" onclick="prev()">← Back</button><button class="btn btn-primary" onclick="next()">Continue →</button></div></div>`;
if(step==6)return`<div class="step active"><span class="step-number">6</span><h2>Campaigns</h2><p class="step-description">Marketing activation frequency</p><div class="input-group"><label class="input-label">Campaigns per Month</label><input type="number" id="camp" placeholder="25" min="0"></div><div class="checkbox-item" data-ch="email"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">📧 Email</div></div></div><div class="checkbox-item" data-ch="fb"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">📘 Facebook</div></div></div><div class="checkbox-item" data-ch="google"><div class="checkbox-box"></div><div style="flex:1"><div class="checkbox-title">🔍 Google Ads</div></div></div><div class="info-box"><div class="info-box-title">🎯 Activations: <span id="act">0</span>/month</div></div><div class="button-group"><button class="btn btn-secondary" onclick="prev()">← Back</button><button class="btn btn-primary" onclick="calc()">Calculate →</button></div></div>`;
return`<div class="step active"><span class="step-number">✓</span><h2>Your Investment</h2><div class="summary-header"><div class="summary-title">${data.useCase=='agentforce'?'🤖 AI-Powered Engagement':'🎯 Personalization'}</div><div class="summary-req-item">Profiles: ${fmt(calcProf())}</div><div class="summary-req-item">Data: ${calcGB()} GB/mo</div><div class="summary-req-item">Documents: ${calcDocs()}</div></div><div style="background:#fff;border-radius:12px;border:1px solid var(--border)"><div class="cost-row"><div>Base License</div><div>Enterprise</div><div>Core platform</div><div class="cost-value">$108,000</div></div><div class="cost-row"><div>Profiles</div><div>${fmt(calcProf())} profiles</div><div>Storage+unification</div><div class="cost-value">${cur(calcProf()*0.000108)}</div></div><div class="cost-row"><div>Data Ingestion</div><div>${calcGB()} GB/mo</div><div>12 months</div><div class="cost-value">${cur(calcGB()*0.10*12)}</div></div>${data.useCase=='agentforce'?`<div class="cost-row"><div>AI Processing</div><div>${calcDocs()} docs</div><div>Unstructured</div><div class="cost-value">${cur(calcDocs()*10)}</div></div>`:''}<div class="cost-row"><div>Activations</div><div>${calcAct()}/mo</div><div>Campaigns</div><div class="cost-value">${cur(calcAct()*0.50*12)}</div></div><div class="cost-row total"><div>TOTAL ANNUAL</div><div></div><div>Monthly: ${cur(calcTotal()/12)}</div><div class="cost-value">${cur(calcTotal())}</div></div></div><div class="button-group"><button class="btn btn-secondary" onclick="location.reload()">Start Over</button></div></div>`}
function attach(){
document.querySelectorAll('.use-case-card').forEach(c=>c.onclick=function(){document.querySelectorAll('.use-case-card').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');data.useCase=this.dataset.use;document.getElementById('next1').disabled=false});
document.querySelectorAll('.checkbox-item[data-id]').forEach(c=>c.onclick=function(){this.classList.toggle('selected');data.identity[this.dataset.id]=this.classList.contains('selected')});
document.querySelectorAll('.checkbox-item[data-src]').forEach(c=>c.onclick=function(){this.classList.toggle('selected');let s=this.dataset.src,i=data.sources.indexOf(s);if(i>-1)data.sources.splice(i,1);else data.sources.push(s);upGB();let b=document.getElementById('next4');if(b)b.disabled=data.sources.length==0});
document.querySelectorAll('.checkbox-item[data-ch]').forEach(c=>c.onclick=function(){this.classList.toggle('selected');let s=this.dataset.ch,i=data.channels.indexOf(s);if(i>-1)data.channels.splice(i,1);else data.channels.push(s);upAct()});
['prod','faq','tech'].forEach(id=>{let e=document.getElementById(id);if(e)e.oninput=()=>{data.docs[id]=parseInt(e.value)||0;upDocs()}});
['crm','web'].forEach(id=>{let e=document.getElementById(id);if(e)e.oninput=()=>{data.base[id]=parseInt(e.value)||0;upProf()}});
let camp=document.getElementById('camp');if(camp)camp.oninput=()=>{data.campaigns=parseInt(camp.value)||0;upAct()}}
function next(){step++;update()}
function prev(){step--;update()}
function calc(){step=7;update()}
function update(){render();document.getElementById('progress').style.width=((step-1)/6*100)+'%';window.scrollTo(0,0)}
function upDocs(){let t=Object.values(data.docs).reduce((a,b)=>a+b,0),e=document.getElementById('tot');if(e)e.textContent=t}
function upGB(){let gb={'crm':30,'aep':50,'ecom':35},t=0;data.sources.forEach(s=>t+=gb[s]||0);let e=document.getElementById('gb');if(e)e.textContent=t}
function upProf(){let p=(data.base.crm||0)+Math.floor((data.base.web||0)*0.3),e=document.getElementById('prof');if(e)e.textContent=fmt(p)}
function upAct(){let a=data.campaigns*data.channels.length,e=document.getElementById('act');if(e)e.textContent=a}
function calcProf(){return(data.base.crm||0)+Math.floor((data.base.web||0)*0.3)}
function calcGB(){let gb={'crm':30,'aep':50,'ecom':35},t=0;data.sources.forEach(s=>t+=gb[s]||0);return t}
function calcDocs(){return Object.values(data.docs).reduce((a,b)=>a+b,0)}
function calcAct(){return data.campaigns*data.channels.length}
function calcTotal(){let base=108000,prof=calcProf()*0.000108,ing=calcGB()*0.10*12,docs=calcDocs()*10,act=calcAct()*0.50*12;return base+prof+ing+(data.useCase=='agentforce'?docs:0)+act}
function fmt(n){return n.toLocaleString()}
function cur(n){return'$'+Math.round(n).toLocaleString()}
update()
</script>
</body>
</html>
